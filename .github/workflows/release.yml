name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  ORCHESTRATOR_IMAGE: ${{ github.repository }}
  AUDALAXY_IMAGE: ${{ github.repository_owner }}/radio-node-audalaxy

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/orchestrator/ClientApp/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: apps/orchestrator/ClientApp
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: apps/orchestrator/ClientApp
        run: npm run build

      - name: Restore Backend Dependencies
        run: |
          dotnet tool restore
          dotnet restore apps/orchestrator/AudioOrchestrator.csproj

      - name: Build Backend
        run: dotnet build apps/orchestrator/AudioOrchestrator.csproj --no-restore

      - name: Run Backend Tests
        run: dotnet test apps/orchestrator-tests/orchestrator-tests.csproj

  pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-pr:
    name: Build & Push PR Docker Images (Internal PRs Only)
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Orchestrator PR image
        uses: docker/build-push-action@v7
        with:
          context: apps/orchestrator
          file: apps/orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORCHESTRATOR_IMAGE }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=orch
          cache-to: type=gha,mode=max,scope=orch

      - name: Build and push Audalaxy Plugin PR image
        uses: docker/build-push-action@v7
        with:
          context: apps/radio-node-audalaxy
          file: apps/radio-node-audalaxy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.AUDALAXY_IMAGE }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=audalaxy
          cache-to: type=gha,mode=max,scope=audalaxy

  release-please:
    name: Release Please (PR & Release Automation)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Google Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-experimental:
    name: Build & Push Experimental Docker Images
    needs: [test, release-please]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Short SHA
        id: meta-info
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Orchestrator Experimental image
        uses: docker/build-push-action@v7
        with:
          context: apps/orchestrator
          file: apps/orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORCHESTRATOR_IMAGE }}:experimental
            ${{ env.REGISTRY }}/${{ env.ORCHESTRATOR_IMAGE }}:sha-${{ steps.meta-info.outputs.sha }}
          cache-from: type=gha,scope=orch
          cache-to: type=gha,mode=max,scope=orch

      - name: Build and push Audalaxy Experimental image
        uses: docker/build-push-action@v7
        with:
          context: apps/radio-node-audalaxy
          file: apps/radio-node-audalaxy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AUDALAXY_IMAGE }}:experimental
            ${{ env.REGISTRY }}/${{ env.AUDALAXY_IMAGE }}:sha-${{ steps.meta-info.outputs.sha }}
          cache-from: type=gha,scope=audalaxy
          cache-to: type=gha,mode=max,scope=audalaxy

  docker-release:
    name: Multi-Arch Build & Release Docker Images
    needs: [test, release-please]
    if: always() && needs.test.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Orchestrator metadata
        id: meta-orch
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORCHESTRATOR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=raw,value=latest

      - name: Build and push Multi-Arch Orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: apps/orchestrator
          file: apps/orchestrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-orch.outputs.tags }}
          labels: ${{ steps.meta-orch.outputs.labels }}
          cache-from: type=gha,scope=orch
          cache-to: type=gha,mode=max,scope=orch

      - name: Extract Audalaxy metadata
        id: meta-audalaxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.AUDALAXY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=raw,value=latest

      - name: Build and push Multi-Arch Audalaxy Plugin image
        uses: docker/build-push-action@v7
        with:
          context: apps/radio-node-audalaxy
          file: apps/radio-node-audalaxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-audalaxy.outputs.tags }}
          labels: ${{ steps.meta-audalaxy.outputs.labels }}
          cache-from: type=gha,scope=audalaxy
          cache-to: type=gha,mode=max,scope=audalaxy

      - name: Generate OpenAPI spec for Release
        run: |
          dotnet tool restore
          dotnet build apps/orchestrator/AudioOrchestrator.csproj
          cp apps/orchestrator/AudioOrchestrator.json openapi.json

      - name: Upload OpenAPI Asset to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            openapi.json
